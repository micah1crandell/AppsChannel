name: Bug Report
description: File a bug report or issue with AppsChannel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with AppsChannel! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When activating Quick Launcher via ⌥L...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open AppsChannel
        2. Press '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS Version & Hardware
      description: e.g. macOS 14.5 Sonoma (M2 Mac Mini) or macOS 15 Sequoia (M3 Max)
      placeholder: macOS 14.5, Apple Silicon
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: AppsChannel Version
      description: What version or commit of AppsChannel are you using?
      placeholder: v1.0.0
    validations:
      required: true
