name: 🐛 Bug Report
description: File a bug report to help improve AppsChannel
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in AppsChannel! Please ensure you have tested the latest release.

  - type: input
    id: version
    attributes:
      label: AppsChannel Version
      description: What version of AppsChannel are you using? (Check Settings > About or Homebrew version)
      placeholder: "e.g., 1.0.1 (Build 2)"
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      description: What version of macOS are you running?
      options:
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 13 Ventura or earlier"
    validations:
      required: true

  - type: dropdown
    id: display-mode
    attributes:
      label: Active Display Mode
      description: Which visual layout mode was active when the bug occurred?
      options:
        - "Quick Launcher (⌥L HUD)"
        - "Cover Flow Carousel"
        - "Curved Amphitheater Wall Grid"
        - "Flat Channel Grid"
        - "Settings / Preferences Modal"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Press ⌥L to open Quick Launcher
        2. Type 'terminal'
        3. Press Return
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs-screenshots
    attributes:
      label: Screenshots or Crash Logs
      description: Drag & drop screenshots, screen recordings, or relevant Console logs.
    validations:
      required: false
