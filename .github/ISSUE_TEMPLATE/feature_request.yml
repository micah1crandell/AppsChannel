name: 💡 Feature Request
description: Suggest an idea or enhancement for AppsChannel
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make AppsChannel a better macOS launcher or retro gaming experience? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is (e.g. "I'm always frustrated when...").
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Area of Enhancement
      description: Which part of AppsChannel does this primarily affect?
      options:
        - "Visual Design & Themes (Cover Flow / Wall / Flat Grid / Liquid Glass)"
        - "Audio & Haptic Feedback"
        - "Launcher UX & Search Intelligence"
        - "Keyboard Shortcuts & Navigation"
        - "macOS System Integration / Settings"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: Any alternative solutions or workarounds you've thought about.
    validations:
      required: false
