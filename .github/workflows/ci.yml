name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify macOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -switch "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project AppsChannel.xcodeproj -scheme AppsChannel

      - name: Build AppsChannel (Debug)
        run: |
          xcodebuild -project AppsChannel.xcodeproj \
            -scheme AppsChannel \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project AppsChannel.xcodeproj \
            -scheme AppsChannel \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Helper Scripts
        run: |
          bash -n scripts/sign_app.sh
          bash -n scripts/create_dmg.sh
          bash -n scripts/update_cask.sh
          bash -n scripts/generate_appcast.sh
          echo "✅ All release scripts verified."
